# golangci-lint configuration
# Docs: https://golangci-lint.run/usage/configuration/
version: "2"

run:
  go: "1.23"
  timeout: 5m

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    gofmt:
      simplify: true
    goimports:
      local-prefixes: github.com/nerdneilsfield/lark-cli-gateway

linters:
  # Standard set: errcheck, govet, ineffassign, staticcheck, unused
  default: standard
  enable:
    - misspell
    - unconvert
  settings:
    misspell:
      locale: US
    unconvert:
      check-untyped-bools: true
