version: 2

project_name: lark-cli-gateway

builds:
  - id: server
    main: ./cmd/lark-gateway-server
    binary: lark-gateway-server
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    mod_timestamp: "{{ .CommitTimestamp }}"
  - id: cli
    main: ./cmd/lark-gateway-cli
    binary: lark-gateway-cli
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: server-archive
    ids:
      - server
    name_template: "lark-gateway-server_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    wrap_in_directory: true
  - id: cli-archive
    ids:
      - cli
    name_template: "lark-gateway-cli_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats:
          - zip
    wrap_in_directory: true

checksum:
  name_template: checksums.txt
  algorithm: sha256

sboms:
  - artifacts: archive

changelog:
  use: git
  sort: asc
  abbrev: -1
  groups:
    - title: Features
      regexp: '^feat(?:\(.+\))?!?:.*'
      order: 0
    - title: Bug Fixes
      regexp: '^fix(?:\(.+\))?!?:.*'
      order: 1
    - title: Performance
      regexp: '^perf(?:\(.+\))?!?:.*'
      order: 2
    - title: Other Changes
      regexp: '^.*$'
      order: 999

release:
  prerelease: auto
  preflight:
    fail_on_error: true

# Publish to the nerdneilsfield/homebrew-apps tap and Scoop bucket.
homebrew_casks:
  - name: lark-gateway-server
    ids:
      - server-archive
    homepage: https://github.com/nerdneilsfield/lark-cli-gateway
    description: Local HTTP gateway that queues and forwards messages to lark-cli
    binaries:
      - lark-gateway-server
    directory: Casks
    repository:
      owner: nerdneilsfield
      name: homebrew-apps
      token: "{{ .Env.TAP_GITHUB_TOKEN }}"
    hooks:
      post:
        install_steps: |
          on_macos do
            run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{ .StagedPath }}/lark-gateway-server"]
          end
  - name: lark-gateway-cli
    ids:
      - cli-archive
    homepage: https://github.com/nerdneilsfield/lark-cli-gateway
    description: Command-line client for lark-gateway-server
    binaries:
      - lark-gateway-cli
    directory: Casks
    repository:
      owner: nerdneilsfield
      name: homebrew-apps
      token: "{{ .Env.TAP_GITHUB_TOKEN }}"
    hooks:
      post:
        install_steps: |
          on_macos do
            run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{ .StagedPath }}/lark-gateway-cli"]
          end

scoops:
  - name: lark-gateway-server
    ids:
      - server-archive
    homepage: https://github.com/nerdneilsfield/lark-cli-gateway
    description: Local HTTP gateway that queues and forwards messages to lark-cli
    license: MIT
    directory: bucket
    repository:
      owner: nerdneilsfield
      name: homebrew-apps
      token: "{{ .Env.TAP_GITHUB_TOKEN }}"
  - name: lark-gateway-cli
    ids:
      - cli-archive
    homepage: https://github.com/nerdneilsfield/lark-cli-gateway
    description: Command-line client for lark-gateway-server
    license: MIT
    directory: bucket
    repository:
      owner: nerdneilsfield
      name: homebrew-apps
      token: "{{ .Env.TAP_GITHUB_TOKEN }}"
